[project]
name = "iptv-cache-service"
version = "0.1.0"
description = "Allowlisted IPTV episode cache service"
requires-python = ">=3.11"
dependencies = [
  "anyio>=4.10.0",
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
]

[project.scripts]
iptv-cache = "iptv_cache.main:main"

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iptv_cache"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D", "INP001", "S101", "TC001"]

[tool.basedpyright]
typeCheckingMode = "all"
venvPath = "."
venv = ".venv"
